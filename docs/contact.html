        <form class="contact-form" id="contact">
            <h2>Contact Us</h2>
            <label for="fname">First Name:</label>
            <input required type="text" id="fname" name="fname">
            <br><label for="lname">Last Name:</label>
            <input required type="text" id="lname" name="lname">
            <br><label for="email">Email Address:</label>
            <input required type="email" id="email" name="email">
            <br><label for="mobile">Mobile Number:</label>
            <input required type="text" id="mobile" name="mobile">
            <br><label for="message">Describe your query:</label>
            <textarea placeholder="Provide as much detail as possible so we can help you with your request..." id="message" name="message" rows="5"></textarea>
            <br><button type="submit" id="submit">Submit</button>
        </form>
        <script>
            // Show an alert message when the form is filled in
            document.getElementById("contact").addEventListener("submit", function () {
                alert("Thank you for submitting. We will get back to you as soon as possible.")
            });
        </script>

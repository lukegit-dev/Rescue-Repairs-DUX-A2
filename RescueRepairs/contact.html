<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="title">Rescue Repairs</h1>
    <nav class="navbar-links">
        <a href="home.html">Home</a>
        <a href="services.html">Upgrades & Repairs</a>
        <a href="contact.html">Contact Us</a>
    </nav>
    <form class="contact-form">
        <h2>Contact Us</h2>
        <label for="fname">First Name:</label>
        <input required type="text" id="fname" name="fname">
        <br><label for="lname">Last Name:</label>
        <input required type="text" id="lname" name="lname">
        <br><label for="email">Email Address:</label>
        <input required type="email" id="email" name="email">
        <br><label for="mobile">Mobile Number:</label>
        <input required type="text" id="mobile" name="mobile">
        <br><label for="message">Describe your query:</label>
        <textarea placeholder="Provide as much detail as possible so we can help you with your request..." id="message" name="message" rows="5"></textarea>
        <br><button type="submit">Submit</button>
    </form>
    <footer class="navbar-links">
        <p>© 2026 Rescue Repairs<br><br>
            Email: <a href="mailto:enquiries@rescuerepairs.com">enquiries@rescuerepairs.com</a>
            Tel: <a href="tel:0777 777 7777">0777 777 7777</a>
        </p>
    </footer>
</body>
